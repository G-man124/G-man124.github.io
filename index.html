<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>reCAPTCHA</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 50px; }
    .captcha-box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 280px; }
    .canvas-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    canvas { border: 1px solid #999; background: #f4f4f4; border-radius: 4px; }
    input, button { padding: 8px; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    #status { margin-top: 10px; font-weight: bold; }
    h1 { font-size: 1.5rem; margin-bottom: 12px; text-align: center; }
  </style>
</head>
<body>
    <noscript>
        <p style="color: red;">JavaScript is required to use this CAPTCHA.</p>
    </noscript>
  <div class="captcha-box">
    <div class="canvas-row">
      <canvas id="captchaCanvas" width="180" height="50"></canvas>
      <button type="button" onclick="generateCaptcha()" title="Refresh">↻</button>
    </div>
    <!-- Fixed: Removed space in validateCaptcha -->
    <form onsubmit="validateCaptcha(event)">
      <input type="text" id="captchaInput" placeholder="Enter characters" required autocomplete="off">
      <button type="submit">Verify</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    let currentCaptcha = "";

    function generateCaptcha() {
      const canvas = document.getElementById("captchaCanvas");
      const ctx = canvas.getContext("2d");
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      currentCaptcha = "";

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = `rgb(${rand(100,200)}, ${rand(100,200)}, ${rand(100,200)})`;
        ctx.beginPath();
        ctx.moveTo(rand(0, canvas.width), rand(0, canvas.height));
        ctx.lineTo(rand(0, canvas.width), rand(0, canvas.height));
        ctx.stroke();
      }

      ctx.font = "bold 26px Courier New";
      ctx.textBaseline = "middle";

      for (let i = 0; i < 6; i++) {
        const char = chars.charAt(Math.floor(Math.random() * chars.length));
        currentCaptcha += char;
        ctx.save();
        const x = 20 + i * 25;
        const y = canvas.height / 2 + rand(-5, 5);
        const angle = rand(-25, 25) * (Math.PI / 180);
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = `rgb(${rand(20,100)}, ${rand(20,100)}, ${rand(20,100)})`;
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }

      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = "#888";
        ctx.fillRect(rand(0, canvas.width), rand(0, canvas.height), 2, 2);
      }
    }

    function validateCaptcha(event) {
      event.preventDefault();
      const userInput = document.getElementById("captchaInput").value.trim().toUpperCase();
      const status = document.getElementById("status");

      if (userInput === currentCaptcha) {
        status.style.color = "green";
        status.innerHTML = "<p>Verified! Redirecting...\nIf you are not redirected, click here: <a href='/'>https://g-man124.github.io</a></p>";
        window.location.href = "/";
      } else {
        status.style.color = "red";
        status.textContent = "Incorrect. Try again.";
        document.getElementById("captchaInput").value = "";
        generateCaptcha();
      }
    }

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    generateCaptcha();
  </script>
</body>
</html>
