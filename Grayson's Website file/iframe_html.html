<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pointer Lock Game Demo</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        #gameCanvas {
            width: 600px;
            height: 400px;
            background-color: #111;
            border: 2px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="gameCanvas">Click here to start playing (Press ESC to exit)</div>

    <script>
        const gameZone = document.getElementById('gameCanvas');

        // 1. Request pointer lock when the user clicks the game zone
        gameZone.addEventListener('click', () => {
            gameZone.requestPointerLock();
        });

        // 2. Optional: Track pointer lock changes (detect when they enter or exit)
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === gameZone) {
                gameZone.textContent = "Game Active! Mouse is locked and hidden.";
            } else {
                gameZone.textContent = "Click here to start playing (Press ESC to exit)";
            }
        });
    </script>

</body>
</html>
