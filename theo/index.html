<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Theo!</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Tropical Confetti & Leaf Rain Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <div class="safari-basecamp">
        <div class="safari-header">
            <h1 class="safari-title">Happy Birthday Theo!</h1>
        </div>
        <div class="safari-subtitle"></div>

        <!-- The Playful Wooden Synth Control -->
        <button class="safari-btn" onclick="playJungleChimes()">
            <span class="btn-icon"></span> Play Happy Birthday!
        </button><br><a href="tv/">Stick Man Animator!</a>

        <div class="safari-grid">
            <!-- Widget 1: Catch the Dinosaur Reflex Game -->
            <div class="safari-card">
                <h3>🍕 Eat the yummy pizza</h3>
                <div class="safari-viewport" id="gameArea">
                    <div id="safariScore">Eaten Pizza: <span id="score">0</span></div>
                    <div id="cakeTarget">🍕</div>
                </div>
            </div>

            <!-- Widget 3: Floating Coconut Popper -->
            <div class="safari-card">
                <h3>Balloon Popper</h3>
                <div class="safari-pop-viewport" id="balloonZone"></div>
            </div>

            <!-- Widget 4: Expedition Life Timeline Log -->
            <div class="safari-card">
                <h3>Your Age</h3>
                <div class="timeline-logs">
                    <div class="log-stat">You are</div>
                    <div class="log-counter" id="ageDaysCounter">Calculating...</div>
                    <div class="log-stat-sub">Years Old!</div>
                </div>
            </div>

            <!-- Widget 5: Volcano Fruit Drop Sandbox (Gravity Physics) -->
            <div class="safari-card">
                <h3>Fun word Fall</h3>
                <div class="gravity-sandbox" id="gravitySandbox">
                    <div class="sandbox-instructions">Click inside to launch words (like "Hello." or "How Are You?")</div>
                </div>
            </div>
            <div class="safari-card">
                <h3>text "Hello, Theo" drag</h3>
            </div>
        </div>
    </div>

    <!-- Core Script Automation Engine -->
    <script src="script.js"></script>
</body>
</html>
