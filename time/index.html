<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Checker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }

    .clock {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }

    .date {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent);
      color: #0f172a;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Time Checker</h1>
    <div class="clock" id="clock">00:00:00</div>
    <div class="date" id="date">Loading date...</div>
    <button id="toggleFormat">Switch to 24-Hour Format</button>
  </div>

  <script>
    const clockEl = document.getElementById("clock");
    const dateEl = document.getElementById("date");
    const toggleBtn = document.getElementById("toggleFormat");

    let is24Hour = false;

    toggleBtn.addEventListener("click", () => {
      is24Hour = !is24Hour;
      toggleBtn.textContent = is24Hour
        ? "Switch to 12-Hour Format"
        : "Switch to 24-Hour Format";
      updateTime();
    });

    function updateTime() {
      const now = new Date();

      const timeOptions = {
        hour: "2-digit",
        minute: "2-digit",
        hour12: !is24Hour
      };

      const dateOptions = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      };

      clockEl.textContent = now.toLocaleTimeString("en-US", timeOptions);
      dateEl.textContent = now.toLocaleDateString("en-US", dateOptions);
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>

</body>
</html>
